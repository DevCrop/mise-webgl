name: Docs (tag)

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: docs-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build versioned docs artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.36.0
        with:
          php-version: "8.2"
          tools: none

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Resolve docs base path
        id: docs
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "base_path=/mise-webgl/v${version}" >> "$GITHUB_OUTPUT"

      - name: Build static documentation site
        env:
          MISE_DOCS_BASE_PATH: ${{ steps.docs.outputs.base_path }}
        run: npm run build:docs

      - name: Upload versioned docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-docs-${{ github.ref_name }}
          path: apps/mise-docs/dist/public
          if-no-files-found: error
          retention-days: 90
