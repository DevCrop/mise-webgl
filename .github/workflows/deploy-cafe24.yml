name: Deploy Cafe24

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe24-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && vars.CAFE24_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cafe24-production

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.19.5
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify and package
        run: |
          npm audit --audit-level=high
          npm run verify
          node scripts/package-cafe24.mjs

      - name: Configure trusted SFTP
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CAFE24_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CAFE24_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cafe24"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cafe24" "$HOME/.ssh/known_hosts"

      - name: Upload app, assets, then entrypoint
        shell: bash
        env:
          CAFE24_SSH_HOST: ${{ vars.CAFE24_SSH_HOST }}
          CAFE24_SSH_PORT: ${{ vars.CAFE24_SSH_PORT }}
          CAFE24_SSH_USER: ${{ vars.CAFE24_SSH_USER }}
        run: |
          sftp \
            -P "${CAFE24_SSH_PORT:-22}" \
            -i "$HOME/.ssh/cafe24" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -b .release/cafe24/deploy.sftp \
            "${CAFE24_SSH_USER}@${CAFE24_SSH_HOST}"

      - name: Verify production response
        env:
          CAFE24_HEALTH_URL: ${{ vars.CAFE24_HEALTH_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$CAFE24_HEALTH_URL" > /dev/null
