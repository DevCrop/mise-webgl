name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.36.0
        with:
          php-version: "8.2"
          tools: none

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify MISE packages
        run: npm run verify:ci

      - name: Verify host consumer against tarball
        run: npm run verify:host-consumer

      - name: Upload mise-webgl tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-webgl-${{ github.sha }}
          path: .release/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: always()
    needs:
      - verify
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce required result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"
