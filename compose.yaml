name: portfolio-lite

services:
  web:
    build:
      context: .
      target: runtime
    image: portfolio-lite:local
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lock/apache2:size=1m,mode=0755
      - /var/run/apache2:size=1m,mode=0755
